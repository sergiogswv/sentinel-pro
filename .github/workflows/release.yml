name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: sentinel

          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: sentinel

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: sentinel

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sentinel.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate checksums
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum ${{ matrix.binary_name }} > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: sentinel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-crates-io]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: 'sentinel-*/sentinel*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(./scripts/extract-version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get checksum
        id: checksum
        run: |
          RELEASE_TAG=${{ github.ref_name }}
          wget https://github.com/sentinel-team/sentinel-pro/releases/download/${RELEASE_TAG}/sentinel-${{ steps.version.outputs.version }}-x86_64-apple-darwin.zip || true
          if [ -f sentinel-*.zip ]; then
            CHECKSUM=$(sha256sum sentinel-*.zip | awk '{print $1}')
            echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          else
            echo "checksum=PLACEHOLDER_SHA256" >> $GITHUB_OUTPUT
          fi

      - name: Update Homebrew formula
        run: |
          ./scripts/update-homebrew.sh ${{ steps.version.outputs.version }} ${{ steps.checksum.outputs.checksum }}

  update-chocolatey:
    name: Update Chocolatey
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Get version and checksum
        id: release
        run: |
          VERSION=$(./scripts/extract-version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "checksum=PLACEHOLDER_CHECKSUM" >> $GITHUB_OUTPUT

      - name: Update Chocolatey files
        run: |
          ./scripts/update-chocolatey.sh ${{ steps.release.outputs.version }} ${{ steps.release.outputs.checksum }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Docusaurus
        run: |
          cd website
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [publish-crates-io, create-release, update-homebrew, deploy-docs]
    if: always()
    steps:
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🎉 Sentinel ${{ github.ref_name }} released!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Sentinel Release*\nVersion: ${{ github.ref_name }}\nStatus: ${{ job.status }}"
                  }
                }
              ]
            }
